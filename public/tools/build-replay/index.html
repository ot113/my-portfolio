<style>
*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}
/* Layout: an editor window in the engine's dark skin. Tab bar, toolbar, scene view + inspector, keyframe timeline, status bar. Single dark theme, by choice. */
:root {
  --tabbar: #232323;
  --win: #282828;
  --toolbar: #3c3c3c;
  --panel: #383838;
  --field: #2a2a2a;
  --sep: #1d1d1d;
  --hover: #464646;
  --fg: #d2d2d2;
  --muted: #8f8f8f;
  --sel: #2c5d87;
  --sel-line: #4d90c9;
  --cut: #d4574a;
  --ui: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--win); color: var(--fg); font: 12px/1.45 var(--ui); display: grid; grid-template-rows: auto auto 1fr auto auto; overflow: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 1px solid var(--sel-line); outline-offset: 1px; }

.tabs { background: var(--tabbar); display: flex; align-items: end; gap: 1px; padding-top: 4px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--sep); }
.tab { background: var(--toolbar); padding: 5px 14px 6px; border-radius: 3px 3px 0 0; border-top: 2px solid var(--sel-line); font-weight: 500; }
.tab.off { background: transparent; border-top-color: transparent; color: var(--muted); font-weight: 400; }
.tabs .path { margin-left: auto; align-self: center; color: var(--muted); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.toolbar { background: var(--toolbar); border-bottom: 1px solid var(--sep); display: flex; align-items: center; gap: 4px; padding-block: 3px; padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
.tb { background: #4a4a4a; border: 1px solid #262626; border-radius: 3px; height: 22px; min-width: 24px; padding: 0 8px; cursor: pointer; display: inline-grid; place-items: center; }
.tb:hover { background: #555; }
.tb[aria-pressed="true"] { background: #6b6b6b; color: #fff; }
.tb svg { width: 11px; height: 11px; fill: currentColor; }
.tb-gap { width: 10px; }
.toolbar .readout { margin-left: auto; font: 11px var(--mono); color: var(--muted); }

main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; min-height: 0; }
.view { position: relative; min-height: 0; min-width: 0; }
.view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tip { position: absolute; pointer-events: none; background: #1f1f1f; border: 1px solid #555; padding: 4px 7px; font: 11px var(--mono); white-space: nowrap; transform: translate(12px, 14px); line-height: 1.5; }
.tip span { color: var(--muted); display: block; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

aside { background: var(--panel); border-left: 1px solid var(--sep); overflow-y: auto; min-width: 0; padding-right: env(safe-area-inset-right, 0px); }
.fold { border-bottom: 1px solid var(--sep); }
.fold > h3 { margin: 0; font-size: 12px; font-weight: 600; background: #3e3e3e; padding: 4px 8px; display: flex; gap: 6px; align-items: center; border-bottom: 1px solid #2f2f2f; }
.fold > h3::before { content: ""; border: 4px solid transparent; border-top-color: var(--fg); margin-top: 4px; }
.fold > h3 small { margin-left: auto; font-weight: 400; color: var(--muted); }
.rows { padding: 6px 10px 8px 22px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 3px 8px; align-items: baseline; }
.rows dt { color: #b4b4b4; }
.rows dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.rows dd.mono { font: 11px var(--mono); color: #c8c8c8; }
.note { margin: 2px 10px 10px 22px; background: var(--field); border: 1px solid #222; border-radius: 2px; padding: 6px 8px; color: #cfcfcf; line-height: 1.5; }
.num { font-variant-numeric: tabular-nums; }
table { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
td, th { padding: 2px 8px; text-align: left; font-weight: 400; }
th { color: var(--muted); font-size: 11px; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.on { background: var(--sel); color: #fff; }
td:first-child, th:first-child { padding-left: 22px; }
.dz { color: var(--muted); }
.legend { padding: 6px 10px 10px 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
.legend span { display: flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; flex: none; border: 1px solid #111; }

.timeline { background: var(--win); border-top: 1px solid var(--sep); overflow-x: auto; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tl { display: grid; grid-template-columns: repeat(20, minmax(32px, 1fr)); min-width: 660px; position: relative; }
.tl .band, .tl .day { font-size: 11px; color: var(--muted); padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid #3a3a3a; }
.tl .band { background: #2e2e2e; color: #b8b8b8; }
.tl .day { background: #303030; border-bottom: 1px solid var(--sep); font-family: var(--mono); font-size: 10px; }
.key { height: 40px; border: 0; background: transparent; cursor: pointer; position: relative; display: grid; place-items: center; padding: 0; border-left: 1px solid #2f2f2f; }
.key::before { content: ""; width: 9px; height: 9px; transform: rotate(45deg); border: 1px solid #9a9a9a; background: transparent; }
.key.past::before { background: #8a8a8a; border-color: #8a8a8a; }
.key span { position: absolute; bottom: 2px; font: 10px var(--mono); color: var(--muted); }
.key:hover::before { border-color: #fff; }
.key[aria-current="step"] { background: color-mix(in srgb, var(--sel) 35%, transparent); }
.key[aria-current="step"]::before { background: var(--sel-line); border-color: #fff; }
.key[aria-current="step"]::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--sel-line); z-index: -1; }
.key[aria-current="step"] span { color: #fff; }

.status { background: var(--toolbar); border-top: 1px solid var(--sep); color: var(--muted); font-size: 11px; padding-block: 3px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 14px; flex-wrap: wrap; }
.status b { color: #bdbdbd; font-weight: 500; }

.tb.pen[aria-pressed="true"] { background: #3d6f99; color: #fff; }
.view.pen canvas { cursor: crosshair; }
.areabtns { display: flex; gap: 4px; padding: 6px 10px 2px 22px; flex-wrap: wrap; align-items: center; }
.chk { display: flex; gap: 5px; align-items: center; margin-right: 6px; cursor: pointer; }
.area-empty { margin: 0; padding: 6px 10px 10px 22px; color: var(--muted); }
.diffbig { padding: 6px 10px 0 22px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.enemy { display: flex; justify-content: space-between; gap: 8px; }
.enemy span { color: var(--muted); }
.spark { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; align-items: end; height: 46px; margin: 2px 10px 0 22px; border-bottom: 1px solid #555; position: relative; }
.spark button { border: 0; padding: 0; min-height: 2px; cursor: pointer; opacity: .75; }
.spark button:hover, .spark button.cur { opacity: 1; }
.spark button.cur { outline: 1px solid #fff; outline-offset: 1px; }
.spark .thr { position: absolute; left: 0; right: 0; border-top: 1px dashed #777; pointer-events: none; }
.sparklab { display: flex; justify-content: space-between; padding: 2px 10px 10px 22px; color: var(--muted); font: 10px var(--mono); }
.areaLabel { position: absolute; pointer-events: none; font-weight: 600; font-size: 12px; text-shadow: 0 1px 2px #000, 0 0 4px #000; transform: translate(-50%, -100%); white-space: nowrap; }

@media (max-width: 860px) {
  body { overflow: auto; height: auto; grid-template-rows: auto auto auto auto auto; }
  main { grid-template-columns: 1fr; }
  .view { height: 55vh; min-height: 300px; }
  aside { border-left: 0; border-top: 1px solid var(--sep); }
  .timeline { order: 0; }
  .tabs .path { display: none; }
}
</style>

</head>

    for (const p of maps[cur].keys()) { const z = zoneOf(p); cnt[z] = (cnt[z] || 0) + 1; }
    if (cur > 0) for (const p of maps[cur - 1].keys()) { const z = zoneOf(p); prev[z] = (prev[z] || 0) + 1; }
    if (focus && !cnt[focus]) focus = null;
    $('zones').innerHTML = Object.keys(cnt).sort().map(z => {
      const dl = cnt[z] - (prev[z] || 0);
      return `<tr data-z="${z}" class="${focus === z ? 'on' : ''}" tabindex="0"><td>${z}</td><td class="r">${cnt[z]}</td><td class="r dz">${dl ? (dl > 0 ? '+' : '−') + Math.abs(dl) : ''}</td></tr>`;
    }).join('');
  }
  const pickZone = e => {
    const r = e.target.closest('tr[data-z]'); if (!r) return;
    focus = focus === r.dataset.z ? null : r.dataset.z; recolor(); renderPanel();
  };
  $('zones').addEventListener('click', pickZone);
  $('zones').addEventListener('keydown', e => { if (e.key === 'Enter') pickZone(e); });

  // ---------- timeline: phase band, day ruler, keyframes
  const track = $('track');
  const day = s => s.date.slice(8, 10) + '.' + s.date.slice(5, 7);
  const runs = [];
  D.steps.forEach((s, i) => { const d = day(s); if (runs.length && runs[runs.length - 1].d === d) runs[runs.length - 1].n++; else runs.push({ d, i, n: 1 }); });
  track.innerHTML =
    `<div class="band" style="grid-column:1/18">Greybox</div><div class="band" style="grid-column:18/21">Art pass</div>` +
    runs.map(r => `<div class="day" style="grid-column:${r.i + 1}/span ${r.n}">${r.d}</div>`).join('') +
    D.steps.map((s, i) => `<button class="key" data-i="${i}" title="${String(i + 1).padStart(2, '0')} ${s.label} · ${s.date}" aria-label="Snapshot ${i + 1}: ${s.label}"><span>${i + 1}</span></button>`).join('');
  track.addEventListener('click', e => { const b = e.target.closest('.key'); if (b) { stop(); go(+b.dataset.i); } });
  // scroll only the timeline strip to the active key: scrollIntoView would also scroll a page that embeds this one
  function keepInTrack(b) {
    let box = b.parentElement;
    while (box && box !== document.body && box.scrollWidth <= box.clientWidth) box = box.parentElement;
    if (!box || box === document.body) return;
    const r = b.getBoundingClientRect(), c = box.getBoundingClientRect();
    if (r.left < c.left) box.scrollLeft -= c.left - r.left;
    else if (r.right > c.right) box.scrollLeft += r.right - c.right;
  }
  function renderTrack() {
    track.querySelectorAll('.key').forEach(b => {
      const i = +b.dataset.i;
      b.classList.toggle('past', i < cur);
      if (i === cur) { b.setAttribute('aria-current', 'step'); keepInTrack(b); }
      else b.removeAttribute('aria-current');
    });
  }

  // ---------- playback
  let playing = false, holdUntil = 0;
  const playIcon = $('playIcon');
  function setPlay(p) {
    playing = p; $('play').setAttribute('aria-label', p ? 'Pause' : 'Play'); $('play').setAttribute('aria-pressed', p);
    playIcon.innerHTML = p ? '<path d="M3 2h4v12H3zM9 2h4v12H9z"/>' : '<path d="M4 2l10 6-10 6z"/>';
  }
  function stop() { setPlay(false); }
  $('play').onclick = () => {
    if (playing) return stop();
    setPlay(true); go(cur >= N - 1 ? 0 : cur + 1); holdUntil = 0;
  };
  $('prev').onclick = () => { stop(); go(cur - 1); };
  $('next').onclick = () => { stop(); go(cur + 1); };
  addEventListener('keydown', e => {
    if (e.target instanceof HTMLInputElement) return;
    if (pen && (e.key === 'Enter' || e.key === 'Escape')) { setPen(false); e.preventDefault(); return; }
    if (e.key === 'Backspace' && pts.length) { pts.pop(); areaChanged(); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { stop(); go(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); e.preventDefault(); }
    else if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { $('play').click(); e.preventDefault(); }
  });
  $('hl').onclick = () => { highlight = !highlight; $('hl').setAttribute('aria-pressed', highlight); recolor(); writeGhosts(); };

  // ---------- camera views
  let camAnim = null;
  $('top').onclick = () => {
    const on = $('top').getAttribute('aria-pressed') !== 'true';
    $('top').setAttribute('aria-pressed', on);
    const to = on ? TOP : HOME;
    camAnim = { t: 0, p0: camera.position.clone(), g0: controls.target.clone(), p1: to.pos, g1: to.tgt };
  };

  // ---------- hover
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = $('tip');
  let hoverEv = null;
  canvas.addEventListener('pointermove', e => { hoverEv = e; });
  canvas.addEventListener('pointerleave', () => { hoverEv = null; tip.hidden = true; });
  function doHover() {
    if (pen && hoverEv) { penHover(hoverEv); hoverEv = null; tip.hidden = true; return; }
    if (!hoverEv || animating) return;
    const e = hoverEv; hoverEv = null;
    if (e.buttons) { tip.hidden = true; return; }
    const r = canvas.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(meshes, false).find(h => h.instanceId !== undefined);
    const it = hit && items.find(x => x.shape === meshes.indexOf(hit.object) && x.slot === hit.instanceId);
    if (!it || it.b < 0) { tip.hidden = true; return; }
    const s = S[it.b], name = D.paths[it.p].replace(/#\d+$/, '');
    tip.innerHTML = `${name.split('/').pop()}<span>${name}</span><span>${D.mats[s[6]]} · ${s[3]} × ${s[4]} × ${s[5]} m</span>`;
    tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px';
    tip.hidden = false;
  }

  // ---------- encounter area pen: same formula as CombatTuning + EncounterAreaAnalysis (values from CombatTuning.asset)
  const T = {
    playerHealth: 100, playerDamage: 25, playerAps: 1.4, playerBlock: 0.7, herbHeal: 40,
    enemies: { Infantry: [60, 12, 1, 0], Spearman: [80, 18, 1, 0], Archer: [40, 15, 1, 0], Sergeant: [120, 20, 1, 0] },
    group: [1, 1.5, 2], smallSide: 8, smallMul: 1.2, chokeMul: 0.85, reference: 0.6, mediumFrom: 1, hardFrom: 1.5 };
  const EHP = (h, b) => h / Math.max(0.05, 1 - b);
  const threat = ty => { const s = T.enemies[ty]; return EHP(s[0], s[3]) * s[1] * s[2]; };
  const typeOf = n => /Archer/.test(n) ? 'Archer' : /Sergeant/.test(n) ? 'Sergeant' : /Spear/.test(n) ? 'Spearman' : 'Infantry';
  const power = herbs => EHP(T.playerHealth + herbs * T.herbHeal, T.playerBlock) * T.playerDamage * T.playerAps;
  const groupMul = n => n <= 1 ? T.group[0] : n === 2 ? T.group[1] : T.group[2];
  const calibration = T.reference / (threat('Infantry') / power(0));
  const BANDS = [['Easy', '#7cad34'], ['Medium', '#d0882a'], ['Hard', '#e35b5b']];
  const bandOf = d => d < T.mediumFrom ? 0 : d <= T.hardFrom ? 1 : 2;

  // what each snapshot holds that the formula reads: enemies (E<n>_ objects), herbs, interactables
  const actorCache = [];
  function actors(i) {
    if (actorCache[i]) return actorCache[i];
    const en = new Map(), herbs = new Map(), inter = [];
    const acc = (m, key, name, s) => { const a = m.get(key) || { name, x: 0, z: 0, n: 0 }; a.x += s[0]; a.z += s[2]; a.n++; m.set(key, a); };
    for (const id of D.steps[i].ids) {
      const s = S[id], seg = D.paths[s[7]].replace(/#\d+$/, '').split('/');
      let k = seg.findIndex(x => /^E\d+_/.test(x));
      if (k >= 0) { acc(en, seg.slice(0, k + 1).join('/'), seg[k], s); continue; }
      k = seg.findIndex(x => x.startsWith('Pickup_'));
      if (k >= 0) { if (seg[k].startsWith('Pickup_Herb')) acc(herbs, seg.slice(0, k + 1).join('/'), seg[k], s); continue; }
      if (D.mats[s[6]] === 'M_Block_Interactive') inter.push({ name: seg[seg.length - 1], x: s[0], z: s[2] });
    }
    const avg = m => [...m.values()].map(a => ({ name: a.name, x: a.x / a.n, z: a.z / a.n }));
    const E = avg(en);
    return actorCache[i] = { E, H: avg(herbs), I: inter, names: new Set(E.map(e => e.name)) };
  }
  const inside = (p, x, z) => {
    let c = false;
    for (let i = 0, j = p.length - 1; i < p.length; j = i++)
      if ((p[i].z > z) !== (p[j].z > z) && x < (p[j].x - p[i].x) * (z - p[i].z) / (p[j].z - p[i].z) + p[i].x) c = !c;
    return c;
  };
  const polyArea = p => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.z - b.x * a.z; } return Math.abs(s) / 2; };

  let pts = [], pen = false, choke = false, hoverPt = null;
  function analyse(i) {
    if (pts.length < 3) return null;
    const A = actors(i), r = { enemies: [], herbs: 0, inter: [] };
    let sum = 0;
    for (const e of A.E) {
      if (!inside(pts, e.x, e.z)) continue;
      if (e.name.endsWith('_B') && A.names.has(e.name.slice(0, -2) + '_A')) continue; // a patrol counts once
      const ty = typeOf(e.name), th = threat(ty);
      sum += th; r.enemies.push({ name: e.name, ty, w: th / threat('Infantry') });
    }
    for (const h of A.H) if (inside(pts, h.x, h.z)) r.herbs++;
    for (const it of A.I) if (inside(pts, it.x, it.z)) r.inter.push(it.name);
    r.area = polyArea(pts); r.small = r.area < T.smallSide * T.smallSide;
    r.group = groupMul(r.enemies.length);
    r.raw = r.enemies.length ? sum * r.group / power(r.herbs) : 0;
    r.space = (r.small ? T.smallMul : 1) * (choke ? T.chokeMul : 1);
    r.d = r.raw * r.space * calibration; r.band = bandOf(r.d);
    return r;
  }

  // drawing: outline, fill, corners, and the rubber band to the cursor while the pen is on
  const areaGroup = new THREE.Group(); areaGroup.renderOrder = 10; scene.add(areaGroup);
  const lift = 0.25;
  function areaColour() { const r = analyse(cur); return r ? BANDS[r.band][1] : '#8cc8ff'; }
  function drawArea() {
    for (const c of [...areaGroup.children]) { areaGroup.remove(c); c.geometry.dispose(); c.material.dispose(); }
    if (!pts.length) return;
    const col = new THREE.Color(areaColour());
    const loop = pts.map(p => new THREE.Vector3(p.x, lift, p.z));
    if (pts.length >= 3) loop.push(loop[0].clone());
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(loop), new THREE.LineBasicMaterial({ color: col, depthTest: false, transparent: true }));
    line.renderOrder = 11; areaGroup.add(line);
    if (pts.length >= 3) {
      const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.z)));
      const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.2, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
      fill.rotation.x = -Math.PI / 2; fill.position.y = lift; fill.renderOrder = 10; areaGroup.add(fill);
    }
    const dots = new THREE.Points(new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p.x, lift, p.z))),
      new THREE.PointsMaterial({ color: 0xffffff, size: 7, sizeAttenuation: false, depthTest: false }));
    dots.renderOrder = 12; areaGroup.add(dots);
    if (pen && hoverPt) {
      const last = pts[pts.length - 1], seg = [new THREE.Vector3(last.x, lift, last.z), new THREE.Vector3(hoverPt.x, lift, hoverPt.z)];
      if (pts.length >= 2) seg.push(new THREE.Vector3(pts[0].x, lift, pts[0].z));
      const rb = new THREE.Line(new THREE.BufferGeometry().setFromPoints(seg), new THREE.LineDashedMaterial({ color: 0x8cc8ff, dashSize: 1, gapSize: 0.7, depthTest: false }));
      rb.computeLineDistances(); rb.renderOrder = 11; areaGroup.add(rb);
    }
  }

  function renderArea() {
    $('corners').textContent = pts.length ? `${pts.length} corners` : '';
    const box = $('area'), r = analyse(cur);
    if (!r) {
      box.innerHTML = `<p class="area-empty">${pen ? `Click the ground to add corners (${pts.length} of at least 3). Enter or Esc ends.`
        : 'Turn on <b>Pen</b> in the toolbar, click the corners of a fight on the ground, and read its difficulty here. The area stays while you step through snapshots.'}</p>`;
    } else {
      const sp = `${Math.round(r.area)} m²` + (r.small ? ` · cramped (&lt;${T.smallSide}×${T.smallSide}) ×${T.smallMul.toFixed(2)}` : '') + (choke ? ` · chokepoint ×${T.chokeMul.toFixed(2)}` : '');
      const all = D.steps.map((_, i) => analyse(i).d), max = Math.max(T.hardFrom * 1.25, ...all);
      box.innerHTML =
        `<div class="diffbig" style="color:${BANDS[r.band][1]}">Difficulty ${r.d.toFixed(2)} · ${BANDS[r.band][0]}</div>` +
        `<dl class="rows">` +
        `<dt style="grid-column:1/-1">Enemies</dt><dd style="grid-column:1/-1;padding-left:12px">${r.enemies.length ? r.enemies.map(e => `<div class="enemy">${e.name}<span>${e.ty} · ${e.w.toFixed(1)}</span></div>`).join('') : '—'}</dd>` +
        `<dt>Group</dt><dd>×${r.group.toFixed(1)} (${r.enemies.length} ${r.enemies.length === 1 ? 'enemy' : 'enemies'})</dd>` +
        `<dt>Herbs</dt><dd>${r.herbs} (+${r.herbs * T.herbHeal} health)</dd>` +
        `<dt>Interactables</dt><dd>${r.inter.length ? r.inter.join(', ') + ' <span style="color:var(--muted)">(not scored yet)</span>' : '—'}</dd>` +
        `<dt>Space</dt><dd>${sp}</dd>` +
        `<dt>Raw ratio</dt><dd class="mono">${r.raw.toFixed(3)} × ${r.space.toFixed(2)} × ${calibration.toFixed(1)}</dd>` +
        `</dl>` +
        `<p class="area-empty" style="padding-bottom:2px">Same area in every snapshot</p>` +
        `<div class="spark" id="spark">` +
        [T.mediumFrom, T.hardFrom].map(v => `<i class="thr" style="bottom:${100 * v / max}%"></i>`).join('') +
        all.map((d, i) => `<button data-i="${i}" class="${i === cur ? 'cur' : ''}" title="${String(i + 1).padStart(2, '0')} ${D.steps[i].label}: ${d.toFixed(2)}" aria-label="Snapshot ${i + 1}: ${d.toFixed(2)}" style="height:${Math.max(2, 100 * d / max)}%;background:${BANDS[bandOf(d)][1]}"></button>`).join('') +
        `</div><div class="sparklab"><span>01</span><span>dashed: medium ${T.mediumFrom} · hard ${T.hardFrom}</span><span>${N}</span></div>`;
    }
    drawArea();
  }
  $('area').addEventListener('click', e => { const b = e.target.closest('#spark button'); if (b) { stop(); go(+b.dataset.i); } });
  function areaChanged() { renderArea(); }
  function setPen(on) {
    pen = on; $('pen').setAttribute('aria-pressed', on); view.classList.toggle('pen', on);
    if (on) { pts = []; tip.hidden = true; }
    hoverPt = null; renderArea();
  }
  $('pen').onclick = () => setPen(!pen);
  $('undoPt').onclick = () => { pts.pop(); areaChanged(); };
  $('clearPt').onclick = () => { pts = []; areaChanged(); };
  $('choke').onchange = e => { choke = e.target.checked; areaChanged(); };

  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), gp = new THREE.Vector3();
  function groundAt(e) {
    const r = canvas.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(meshes, false)[0];
    if (hit) return { x: hit.point.x, z: hit.point.z };
    return ray.ray.intersectPlane(groundPlane, gp) ? { x: gp.x, z: gp.z } : null;
  }
  function penHover(e) { if (!pts.length) return; hoverPt = groundAt(e); drawArea(); }
  let downAt = null;
  canvas.addEventListener('pointerdown', e => { downAt = e.button === 0 ? [e.clientX, e.clientY] : null; });
  canvas.addEventListener('pointerup', e => {
    if (!pen || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
    const p = groundAt(e); if (p) { pts.push(p); areaChanged(); }
  });

  // example area so the panel opens working: a 12 m square on E4's one-on-one (its target is 0.6)
  (function example() {
    const e4 = actors(N - 1).E.find(e => e.name.startsWith('E4_'));
    if (!e4) return;
    pts = [[-6, -6], [6, -6], [6, 6], [-6, 6]].map(([dx, dz]) => ({ x: e4.x + dx, z: e4.z + dz }));
  })();
  const label = $('areaLabel'), lv = new THREE.Vector3();
  function placeLabel() {
    const r = pts.length >= 3 ? analyse(cur) : null;
    if (!r) { label.hidden = true; return; }
    let x = 0, z = 0; for (const p of pts) { x += p.x; z += p.z; }
    lv.set(x / pts.length, 3, z / pts.length).project(camera);
    if (lv.z > 1) { label.hidden = true; return; }
    label.style.left = ((lv.x + 1) / 2 * view.clientWidth) + 'px';
    label.style.top = ((1 - lv.y) / 2 * view.clientHeight) + 'px';
    label.style.color = BANDS[r.band][1];
    label.textContent = `${r.d.toFixed(2)} ${BANDS[r.band][0]}`;
    label.hidden = false;
  }

  // ---------- loop
  function resize() {
    const w = view.clientWidth, h = view.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(view); resize();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (animating) {
      if (writeMatrices(now / 1000 - t0)) { animating = false; holdUntil = now + (cur === 17 ? 2400 : 1500); }
    } else if (playing && holdUntil && now > holdUntil) {
      if (cur >= N - 1) stop(); else go(cur + 1);
    }
    if (camAnim) {
      camAnim.t = Math.min(1, camAnim.t + dt / (reduce ? 0.01 : 0.8));
      const k = ease(camAnim.t);
      camera.position.lerpVectors(camAnim.p0, camAnim.p1, k); controls.target.lerpVectors(camAnim.g0, camAnim.g1, k);
      if (camAnim.t >= 1) camAnim = null;
    }
    controls.update(); doHover(); placeLabel();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  go(N - 1, false);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
